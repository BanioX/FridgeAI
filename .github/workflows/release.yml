name: Release

# When a release PR (`pnpm release`, ADR-0017) lands on main, the version in package.json has no
# GitHub Release yet: this creates tag vX.Y.Z on that commit and the release, with that version's
# section of CHANGELOG.md as notes. Every other change to package.json is a no-op.
on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Release the version in package.json if it has none yet
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p "require('./package.json').version ?? ''")"
          if [ -z "$version" ]; then
            echo "No version in package.json, nothing to release."
            exit 0
          fi
          tag="v${version}"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "${tag} is already released."
            exit 0
          fi
          awk -v head="## [${version}]" 'index($0, "## [") == 1 { take = index($0, head) == 1 } take' \
            CHANGELOG.md > notes.md
          test -s notes.md
          prerelease=""
          if [[ "$version" == 0.* ]]; then prerelease="--prerelease"; fi
          gh release create "$tag" --target "$GITHUB_SHA" $prerelease \
            --title "rettich ${tag}" --notes-file notes.md
