name: Release

# A version tag (vX.Y.Z, pushed after the release PR is merged, ADR-0017) becomes a GitHub
# Release whose notes are that version's section of CHANGELOG.md.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Create the release from CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v head="## [${version}]" 'index($0, "## [") == 1 { take = index($0, head) == 1 } take' \
            CHANGELOG.md > notes.md
          test -s notes.md
          prerelease=""
          if [[ "$version" == 0.* ]]; then prerelease="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" --verify-tag $prerelease \
            --title "FridgeAI ${GITHUB_REF_NAME}" --notes-file notes.md
