name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      code: ${{ steps.changes.outputs.code }}
    steps:
      - uses: actions/checkout@v7

      # Actions minutes cost money on a private repo: a pull request that only touches docs runs
      # format and licences, nothing else; E2E is skipped (a skipped job counts as passed).
      - name: What changed
        id: changes
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --depth=1 origin "${{ github.event.pull_request.base.sha }}"
          if git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD \
            | grep -qvE '^(docs/.*|.*\.md|LICENSE)$'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "Only docs changed: skipping lint, tests, build and E2E."
          fi

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Enable corepack (pnpm version from package.json)
        run: corepack enable

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Licences (no copyleft in what ships, ADR-0015)
        run: pnpm licenses:check

      - name: Format
        run: pnpm format:check

      - name: Lint
        if: steps.changes.outputs.code == 'true'
        run: pnpm lint

      - name: Typecheck
        if: steps.changes.outputs.code == 'true'
        run: pnpm typecheck

      - name: Test with coverage
        if: steps.changes.outputs.code == 'true'
        run: pnpm test:coverage

      - name: Build
        if: steps.changes.outputs.code == 'true'
        run: pnpm build

      # Demo data and the style guide must never ship in production builds (routes.tsx).
      - name: Check production build has no dev tools
        if: steps.changes.outputs.code == 'true'
        run: |
          if ls apps/web/dist/assets | grep -E '^(DemoSeedPage|StyleguidePage)-'; then
            echo "Dev tools found in the production build" >&2
            exit 1
          fi

      # The same command Cloudflare runs (docs/previews.md): demo for preview links, the real
      # app for main.
      - name: Build for Cloudflare (preview links in demo mode)
        if: steps.changes.outputs.code == 'true'
        run: |
          pnpm build:cf
          test -f apps/web/dist/_headers
          ls apps/web/dist/assets | grep -E '^StyleguidePage-'

      - name: Build for Cloudflare (main without dev tools)
        if: steps.changes.outputs.code == 'true'
        env:
          WORKERS_CI_BRANCH: main
        run: |
          pnpm build:cf
          test -f apps/web/dist/_headers
          if ls apps/web/dist/assets | grep -E '^(DemoSeedPage|StyleguidePage)-'; then
            echo "Dev tools found in the build for main" >&2
            exit 1
          fi

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
          retention-days: 14

  e2e:
    name: E2E (Playwright)
    needs: verify
    if: needs.verify.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Enable corepack (pnpm version from package.json)
        run: corepack enable

      - name: Install
        run: pnpm install --frozen-lockfile

      # Only the browser: GitHub's Ubuntu runners already ship the system libraries Chromium needs.
      # `--with-deps` runs apt-get, which hung for >10 minutes on 2026-11-06 (PR #10).
      - name: Install Playwright browser
        timeout-minutes: 5
        run: pnpm --filter @fridgeai/web exec playwright install chromium

      - name: E2E
        run: pnpm e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          if-no-files-found: ignore
          retention-days: 14
