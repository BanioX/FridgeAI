name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Enable corepack (pnpm version from package.json)
        run: corepack enable

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test with coverage
        run: pnpm test:coverage

      - name: Build
        run: pnpm build

      # Demo data and the style guide must never ship in production builds (routes.tsx).
      - name: Check production build has no dev tools
        run: |
          if ls apps/web/dist/assets | grep -E '^(DemoSeedPage|StyleguidePage)-'; then
            echo "Dev tools found in the production build" >&2
            exit 1
          fi

      # The same command Cloudflare runs for main and the preview links (docs/previews.md).
      - name: Build for Cloudflare (demo mode)
        run: |
          pnpm build:cf
          test -f apps/web/dist/_headers
          ls apps/web/dist/assets | grep -E '^StyleguidePage-'

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
          retention-days: 14

  e2e:
    name: E2E (Playwright)
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Enable corepack (pnpm version from package.json)
        run: corepack enable

      - name: Install
        run: pnpm install --frozen-lockfile

      # Only the browser: GitHub's Ubuntu runners already ship the system libraries Chromium needs.
      # `--with-deps` runs apt-get, which hung for >10 minutes on 2026-11-06 (PR #10).
      - name: Install Playwright browser
        timeout-minutes: 5
        run: pnpm --filter @fridgeai/web exec playwright install chromium

      - name: E2E
        run: pnpm e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          if-no-files-found: ignore
          retention-days: 14
