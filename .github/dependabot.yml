version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # Same three days as pnpm's minimumReleaseAge (ADR-0085).
    cooldown:
      default-days: 3
    groups:
      # Always together: the self-hosted .wasm must match barcode-detector's zxing-wasm (ADR-0014).
      barcode:
        patterns: [barcode-detector, zxing-wasm]
      dev-tooling:
        dependency-type: development
        update-types: [minor, patch]
      runtime:
        dependency-type: production
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3
